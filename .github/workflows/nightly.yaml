name: nightly-release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Linux glibc 2.35
          - name: linux-glibc-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu.2.35
            artifact: fasthash-linux-glibc-x86_64

          # Linux musl
          - nnightlyame: linux-musl-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: fasthash-linux-musl-x86_64

          # Windows
          - name: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: fasthash-windows-x86_64.exe

          # macOS ARM64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: fasthash-macos-arm64

          # Android ARM64
          - name: android-arm64
            runner: ubuntu-24.04
            target: aarch64-linux-android
            artifact: fasthash-android-arm64

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: |
            x86_64-unknown-linux-musl
            aarch64-linux-android

      # zigbuild only on Linux
      - name: Install zigbuild
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: cargo install cargo-zigbuild

      # Android NDK
      - name: Setup Android NDK
        if: matrix.target == 'aarch64-linux-android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Install cargo-ndk
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk

      # Linux
      - name: Build Linux
        if: startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          cargo zigbuild \
            --release \
            --target ${{ matrix.target }}

      # Android
      - name: Build Android
        if: matrix.target == 'aarch64-linux-android'
        run: |
          cargo ndk \
            --target aarch64-linux-android \
            build \
            --release

      # Windows/macOS
      - name: Build Native
        if: |
          matrix.target != 'aarch64-linux-android' &&
          !startsWith(matrix.target, 'x86_64-unknown-linux')
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Collect
        shell: bash
        run: |
          mkdir dist

          REAL_TARGET="${{ matrix.target }}"

          # strip glibc suffix
          REAL_TARGET="${REAL_TARGET%%.2.35}"

          cp \
            target/${REAL_TARGET}/release/fasthash* \
            dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  freebsd:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: freebsd
          version: "14.2"
          shell: bash

          run: |
            sudo pkg install -y \
              rust \
              cargo \
              llvm

            cargo build \
              --release \
              --target x86_64-unknown-freebsd

      - run: |
          mkdir dist
          cp \
            target/x86_64-unknown-freebsd/release/fasthash \
            dist/fasthash-freebsd-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: freebsd-x86_64
          path: dist/*

  release:
    needs:
      - build
      - freebsd

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - id: date
        run: |
          echo "date=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly ${{ steps.date.outputs.date }}
          prerelease: true
          files: artifacts/**/*
